<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Article | Zulkarnain</title>

    <!-- Copy the existing stylesheet links from your index HTML here -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="blog-detail-container">
      <a href="index(1).html#blog" class="back-to-blog">
        &larr; Back to Blog
      </a>

      <article id="blog-article" class="blog-article">
        <p id="article-category" class="article-category"></p>

        <h1 id="article-title">Loading article...</h1>

        <div id="article-meta" class="article-meta"></div>

        <img id="article-cover" class="article-cover" alt="" hidden />

        <div id="article-content" class="article-content"></div>
      </article>

      <div id="article-error" hidden>
        <h2>Article unavailable</h2>
        <p id="error-message"></p>
        <a href="index(1).html#blog">Return to Blog</a>
      </div>
    </main>

    <script src="blog-detail.js"></script>
  </body>
</html>
